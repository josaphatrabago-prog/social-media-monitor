# Social Media Monitor - nginx site config
#
# Deployed to /etc/nginx/sites-available/social-media-monitor.
#
# This file is deliberately SEPARATE from the matchpoint config on the same
# droplet. matchpoint's CI rewrites /etc/nginx/sites-available/matchpoint on
# every one of its deploys, so anything for this app placed in that file would
# be silently deleted the next time the tennis site shipped. Separate file,
# separate port, no shared state.
#
# matchpoint owns 80/443 as the default_server. This app listens on 8080.
#
# __MONITOR_TOKEN__ is a placeholder. The deploy workflow substitutes the real
# value from the MONITOR_TOKEN GitHub secret before installing the file, so the
# secret is never committed to the repository.

# The access token is a 48-character hex string, and it appears as a map KEY
# below. nginx sizes its map hash buckets at 64 bytes by default, which a key
# that long overflows - the failure is a hard "could not build map_hash" at
# config-test time, not something subtle. 128 is the next power of two up.
map_hash_bucket_size 128;

# --- Access token -----------------------------------------------------------
# The dashboard is a single page whose CSS and JS are fetched as relative URLs,
# so those follow-up requests cannot carry "?token=...". Accepting the token
# from a cookie as well as the query string is what makes the page actually
# load rather than 401ing on its own stylesheet.
#
# The source string ends in a trailing "|" so every field is pipe-terminated,
# which lets one regex anchor on delimiters alone and avoids putting a literal
# "$" inside a quoted nginx regex.
map "$arg_token|$http_x_monitor_token|$cookie_smm_token|" $smm_authorized {
    default                        0;
    "~(^|\|)__MONITOR_TOKEN__\|"   1;
}

# Arriving with a valid ?token=... exchanges it for a cookie, so the token is
# typed into the address bar once and every later request carries it silently.
# nginx omits an add_header entirely when its value is the empty string, which
# is how this stays a no-op for requests that did not present a token.
map $arg_token $smm_set_cookie {
    default              "";
    "__MONITOR_TOKEN__"  "smm_token=__MONITOR_TOKEN__; Path=/; HttpOnly; SameSite=Lax; Max-Age=31536000";
}

# The Node service. Named upstream so the port appears once.
upstream smm_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/social-media-monitor;
    index index.html;

    access_log /var/log/nginx/social-media-monitor.access.log;
    error_log  /var/log/nginx/social-media-monitor.error.log;

    # The mention feed carries client names and negative sentiment. Keep it out
    # of search engines and out of referrer headers sent to any webhook target.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    # --- Health check -------------------------------------------------------
    # Deliberately NOT behind the token: the deploy smoke-test has to be able to
    # prove nginx is serving without writing the secret into a CI log. It
    # reveals nothing but the fact that a web server is running.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API and live event stream -----------------------------------------
    # Proxied to the Node service. Until server.js exists these return 502,
    # which is correct and visible rather than quietly wrong - the dashboard
    # does not call them yet, so nothing user-facing depends on it.
    location ~ ^/(api|events)(/|$) {
        if ($smm_authorized = 0) {
            return 401 "Unauthorized\n";
        }

        proxy_pass http://smm_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Monitor-Token   "__MONITOR_TOKEN__";

        # Server-sent events: buffering would hold each mention back until the
        # buffer filled, which for a "real-time" feed means it never arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Dashboard ----------------------------------------------------------
    location / {
        if ($smm_authorized = 0) {
            return 401 "Unauthorized\n";
        }

        add_header Set-Cookie $smm_set_cookie;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;

        try_files $uri $uri/ /index.html;
    }

    # Hashed-free static assets on a tool that redeploys often: a short cache
    # beats both a hard 1-year cache (stale dashboard after a deploy) and none
    # at all. Still behind the token gate above via the same map.
    location ~* \.(css|js)$ {
        if ($smm_authorized = 0) {
            return 401 "Unauthorized\n";
        }
        expires 5m;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Never serve the operational files that sit in the same directory as the
    # dashboard. .env is chmod 600 and config.json holds no secrets, but both
    # are one path traversal away from the document root and neither has any
    # business being fetched over HTTP.
    location ~ ^/(\.env|\.git|config\.json|package\.json|package-lock\.json|src/|infra/|tests/|data/|node_modules/) {
        deny all;
        return 404;
    }
}
